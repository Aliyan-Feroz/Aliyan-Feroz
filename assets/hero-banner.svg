<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Aliyan Feroz — Software Engineering Student</title>
  <desc id="description">Software development, cybersecurity, and problem solving.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset=".5" stop-color="#172554"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop stop-color="#2563EB" stop-opacity=".58"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset=".5" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#background)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <g stroke="#38BDF8" stroke-opacity=".32" fill="none" stroke-width="1.5">
    <path d="M0 65h220l42 42h225" stroke-dasharray="8 11"/>
    <path d="M1200 276H950l-42-42H665" stroke-dasharray="8 11"/>
    <path d="M0 298h150l42-42h220" stroke-dasharray="6 12"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="125" cy="315" r="2.5"/>
    <circle cx="345" cy="65" r="2" fill="#93C5FD"/>
    <circle cx="820" cy="315" r="2.5"/>
    <circle cx="1070" cy="65" r="2" fill="#93C5FD"/>
  </g>

  <text x="600" y="145" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="70" font-weight="900" fill="url(#title-gradient)" filter="url(#soft-glow)" letter-spacing="4">ALIYAN FEROZ</text>
  <text x="600" y="205" text-anchor="middle" font-family="Courier New, monospace" font-size="25" fill="#E2E8F0" letter-spacing="1">SOFTWARE ENGINEERING STUDENT</text>
  <text x="600" y="265" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#94A3B8" letter-spacing="2">SOFTWARE DEVELOPMENT • CYBERSECURITY • PROBLEM SOLVING</text>
  <rect y="332" width="1200" height="3" fill="url(#title-gradient)" opacity=".75"/>
</svg>
